name: Cargo license check
on: pull_request
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    # ZKSYNC_ADMIN_BOT_ORG_REPO_WRITE is not shared with this public repo, so mint
    # a MATTERLABS_BOTS App token scoped to the private git dependencies instead.
    - name: Generate token for private git dependencies
      id: private_deps_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
        private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: |
          zksync-airbender-private
          zksync-crypto-private
          zksync-crypto-gpu-private
          zkos-wrapper-private
    - uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.11
      with:
        manifest-path: "Cargo.toml"
        command: check
        command-arguments: "--allow unmaintained --hide-inclusion-graph"
        # Needed to fetch the private fix/87680 git dependencies (see Cargo.toml).
        credentials: "https://x-access-token:${{ steps.private_deps_token.outputs.token }}@github.com"
