[workspace]
members = [
    "crates/sequencer_proof_client",
    "crates/zksync_os_fri_prover",
    "crates/zksync_os_snark_prover",
    "crates/zksync_os_prover_service",
    "crates/protocol_version",
]
resolver = "2"

[workspace.package]
edition = "2021"
#rust-version = "1.88"
version = "0.8.2"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-airbender-prover/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[workspace.dependencies]
# internal dependencies
zksync_sequencer_proof_client = { path = "crates/sequencer_proof_client" }
protocol_version = { path = "crates/protocol_version" }
zksync_os_fri_prover = { path = "crates/zksync_os_fri_prover" }

# zksync-airbender dependencies
# NOTE: the URL form and ref must match the ones used by zkos-wrapper so that
# cargo unifies the git source instead of building two copies of the airbender crates.
# v0.6.0-rc.2 = rc.1 plus matter-labs/zksync-airbender#378
# (`ProgramProver::program_commitment()`), which this workspace uses.
zksync_airbender_execution_utils = { package = "execution_utils", git = "https://github.com/matter-labs/zksync-airbender", tag = "v0.6.0-rc.2" }
zksync_airbender_cli = { package = "cli", git = "https://github.com/matter-labs/zksync-airbender", tag = "v0.6.0-rc.2" }

# zkos-wrapper dependencies
# rev 4389ead4 = matter-labs/zkos-wrapper#77 (fold the unified layer into
# `BinaryCommitment::aux_params`), on airbender v0.6.0-rc.2 like the pins above.
# TODO(zkos-wrapper-77): move to a tag once #77 lands.
# Level stated explicitly, not inherited from the wrapper's default, so it can't drift out
# of lockstep with `PROVING_SECURITY_LEVEL`.
zkos_wrapper = { package = "zkos-wrapper", git = "https://github.com/matter-labs/zkos-wrapper.git", rev = "4389ead4f65a22328826e86c155c95324e8de426", default-features = false, features = ["security_100"] }

# zksync-crypto dependencies
# NOTE: must use the same source spec as zkos-wrapper so cargo unifies the git deps
# (not yet released to crates.io in a version compatible with zkos-wrapper dev).
# TODO: Once zksync-crypto is released to crates.io - switch to using the crates.io version instead of the git version.
crypto_codegen = { package = "zksync_solidity_vk_codegen", git = "https://github.com/matter-labs/zksync-crypto.git", branch = "oh_for_wrapper" }

# external dependencies
anyhow = "1.0.103"
memmap2 = "0.9.11"
async-trait = "0.1"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive"] }
reqwest = { version = "0.12.19", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
vise = "0.3.2"
vise-exporter = "0.3.2"
url = "2.5"

# Things below are to guarantee that we can compile in reasonable time.
# Once we do some optimizations to the zkos-wrapper and compression verifier, we'll be able to remove some of them.

# Debug-info generation for the airbender circuit crates is exponential in LLVM and
# overflows rustc's stack (zksync-airbender disables it the same way in its own profiles).
[profile.dev.package."keccak_special5"]
debug = false

[profile.dev.package."setups"]
debug = false

[profile.release.package."blake2_with_compression_verifier"]
opt-level = 1
codegen-units = 256
overflow-checks = true

[profile.release.package."zkos-wrapper"]
opt-level = 1
codegen-units = 256
overflow-checks = true

[profile.release]
lto = false
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true
